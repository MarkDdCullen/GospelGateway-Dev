<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gospel Gateway - KJV Bible & Hymnal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gospel Gateway">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Gospel Gateway</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      html { background-color: #000000; }
      body { background-color: #000000; }
    }
    @media (prefers-color-scheme: light) {
      html { background-color: #FFFFFF; }
      body { background-color: #FFFFFF; }
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        var dominated = false;
        for (var reg of regs) {
          if (reg.active && reg.active.scriptURL.includes('flutter_service_worker')) {
            reg.unregister();
            dominated = true;
          }
        }
        if (dominated) {
          caches.keys().then(function(names) {
            for (var name of names) {
              if (name.startsWith('flutter')) caches.delete(name);
            }
          });
        }
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
